name: wideday-alert

# WIDE-DAY 11:00 PULLBACK watch -> private Telegram channel. Alert only, never orders. Candidate rule, NOT proven live.
# Public repository = free Actions minutes. GitHub's own timer starts it at about 10:45 IST on weekdays (often a few minutes late);
# the script waits for the 11:00 candle and sends a message only on setup days.
# No secret is stored in this repository: keys live in Actions secrets; the encrypted Dhan token is fetched fresh each run.
on:
  schedule:
    - cron: "15 5 * * 1-5"   # 05:15 UTC = 10:45 IST
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = print instead of sending Telegram"
        default: "0"
      as_of:
        description: "YYYY-MM-DD = evaluate that past day at 11:00 (preview/testing only)"
        default: ""

permissions:
  contents: read

concurrency:
  group: wideday-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests cryptography
      - name: fetch the encrypted Dhan token (kept current by the private token-keeper repo)
        env:
          GH_TOKEN: ${{ secrets.KEEPER_READ_PAT }}
        run: |
          mkdir -p state
          gh api -H "Accept: application/vnd.github.raw" repos/dsoni19-byte/dhan-token-keeper/contents/state/token.enc > state/token.enc
          test -s state/token.enc
      - name: wide-day check
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          TOKEN_ENC_KEY: ${{ secrets.TOKEN_ENC_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SCALPING_CHAT_ID: ${{ vars.SCALPING_CHAT_ID }}
          DRY_RUN: ${{ inputs.dry_run }}
          AS_OF: ${{ inputs.as_of }}
        run: python wideday_alert.py
