name: pankaj-morning

# BANKNIFTY morning LINES + premium alerts tool (Pankaj Sahu style reading, pankaj_tool.py) -> private Telegram channel. Alert only, never orders. Not proven.
# Public repository = free Actions minutes. Started punctually by the cron-job.org job 'AIOS Pankaj Sahu morning alerts' (09:15 IST weekdays, POST workflow_dispatch). No GitHub schedule here, or messages would double.
# No secret is stored in this repository: keys live in Actions secrets; the encrypted Dhan token is fetched fresh each run.
on:
  workflow_dispatch:
    inputs:
      force:
        description: "1 = ignore the weekday/time window (testing)"
        default: "0"
      dry_run:
        description: "1 = print instead of sending Telegram"
        default: "0"
      one_pass:
        description: "1 = with force: do a single check and stop (testing)"
        default: "0"

permissions:
  contents: read

concurrency:
  group: pankaj-morning
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: fetch the encrypted Dhan token (kept current by the private token-keeper repo)
        env:
          GH_TOKEN: ${{ secrets.KEEPER_READ_PAT }}
        run: |
          mkdir -p state
          gh api -H "Accept: application/vnd.github.raw" repos/dsoni19-byte/dhan-token-keeper/contents/state/token.enc > state/token.enc
          test -s state/token.enc
      - name: run Pankaj Sahu style morning alerts
        env:
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          TOKEN_ENC_KEY: ${{ secrets.TOKEN_ENC_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          PANKAJ_CHAT_ID: ${{ vars.PANKAJ_CHAT_ID }}
          FORCE: ${{ inputs.force }}
          DRY_RUN: ${{ inputs.dry_run }}
          ONE_PASS: ${{ inputs.one_pass }}
        run: python pankaj_tool.py
